  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px;">

        <div style="display: flex; gap: 4px;">

          <button type="button" aria-label="Próximo mês" style="width: 40px; height: 40px; border: 1px solid #E6E3F0; border-radius: 10px; background: #FFFFFF; color: #29303C; cursor: pointer; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>

        <button type="button" role="tab" aria-selected="true" style="height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: #FFFFFF; color: #29303C; font: 600 14px 'Figtree', sans-serif; box-shadow: 0 1px 2px rgb(41 48 60 / 0.12); cursor: pointer;">Mês</button>

        <button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; color: #5E6475; font: 500 14px 'Figtree', sans-serif; cursor: pointer;">Dia</button>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
      <span style="font-size: 14px; color: #5E6475; margin-right: 4px;">Profissional</span>
      <button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border: 1px solid #3E07D2; border-radius: 999px; background: #EEE8FD; color: #3E07D2; font: 600 14px 'Figtree', sans-serif; cursor: pointer;">Todos</button>
      <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid #E6E3F0; border-radius: 999px; background: #FFFFFF; color: #29303C; font: 500 14px 'Figtree', sans-serif; cursor: pointer;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #B4237A;"></span>Bia</button>
      <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid #E6E3F0; border-radius: 999px; background: #FFFFFF; color: #29303C; font: 500 14px 'Figtree', sans-serif; cursor: pointer;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #0E7C86;"></span>Léo</button>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E6E3F0; border-radius: 16px; overflow: hidden;">
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid #E6E3F0;">
        <sc-for list="{{weekdays}}" as="wd" hint-placeholder-count="7">
          <div style="padding: 12px 14px; font-size: 13px; font-weight: 600; color: #5E6475;">{{wd}}</div>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
          <button type="button" aria-label="{{d.label}}" style="{{d.cellStyle}}">
            <span style="{{d.numStyle}}">{{d.n}}</span>
            <sc-if value="{{d.hasCount}}" hint-placeholder-val="{{true}}">
              <span style="display: flex; flex-direction: column; gap: 6px; width: 100%;">
                <span style="font-size: 12px; color: #5E6475;" class="num">{{d.countLabel}}</span>
                <span style="display: block; height: 4px; border-radius: 999px; background: #EEEBF6; overflow: hidden;"><span style="{{d.barStyle}}"></span></span>
              </span>
            </sc-if>
            <sc-if value="{{d.closed}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 12px; color: #9A9EAD;">Fechado</span>
            </sc-if>
          </button>
        </sc-for>
      </div>

  <aside aria-label="Agendamentos do dia" style="flex: 1 1 360px; max-width: 400px; box-sizing: border-box; background: #FFFFFF; border-left: 1px solid #E6E3F0; padding: 28px 24px; display: flex; flex-direction: column; gap: 18px;">

      <p style="margin: 0; font-size: 14px; color: #5E6475;" class="num">6 agendamentos · R$ 470 previstos</p>
    </div>
    <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 10px; background: #3E07D2; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Novo agendamento

    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">

          <li aria-label="Agora, 13:40" style="display: flex; align-items: center; gap: 0; padding: 4px 0;">

            <span style="flex: 1; height: 3px; border-radius: 999px; background: linear-gradient(90deg, #3E07D2, #9429F7, #F581FB);"></span>
            <span style="font-size: 12px; font-weight: 600; color: #3E07D2; margin-left: 8px;" class="num">13:40</span>

        </sc-if>
        <sc-if value="{{it.isItem}}" hint-placeholder-val="{{true}}">

            <a href="#" style="{{it.cardStyle}}">
              <span style="font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 16px; width: 48px; flex: none; padding-top: 1px;" class="num">{{it.time}}</span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var weekdays = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    var occ = [0, 35, 55, 70, 45, 80, 90, 0, 40, 60, 75, 65, 85, 95, 0, 30, 50, 70, 60, 90, 100, 0, 45, 65, 55, 70, 85, 75, 0, 40, 60, 35, 20, 10, 5];
    var counts = [0, 3, 4, 6, 4, 7, 8, 0, 3, 5, 6, 5, 7, 9, 0, 2, 4, 6, 5, 8, 9, 0, 4, 6, 5, 6, 7, 7, 0, 3, 6, 3, 2, 1, 1];
    var days = [];
    for (var i = 0; i < 35; i++) {
      var dayNum, other;
      if (i < 4) { dayNum = 27 + i; other = true; } else { dayNum = i - 3; other = false; }
      if (i >= 35) { other = true; }
      var isSunday = i % 7 === 0;
      var isToday = !other && dayNum === 27;
      var past = !other && dayNum < 27;
      var count = other ? 0 : counts[i];
      var cell = 'display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; min-height: 104px; padding: 12px 14px; border: 0; border-right: 1px solid #E6E3F0; border-bottom: 1px solid #E6E3F0; text-align: left; cursor: pointer; font-family: inherit; color: #29303C;';
      cell += isToday ? ' background: #EEE8FD; box-shadow: inset 0 0 0 2px #3E07D2;' : ' background: #FFFFFF;';
      var num = 'font-family: Outfit, sans-serif; font-weight: 600; font-size: 16px;';
      num += other ? ' color: #B9BCC8;' : (past ? ' color: #5E6475;' : ' color: #29303C;');
      if (isToday) num += ' color: #3E07D2;';
      days.push({
        n: dayNum,
        label: (other ? dayNum + ' de setembro' : dayNum + ' de outubro') + (count ? ', ' + count + ' agendamentos' : ''),
        cellStyle: cell,
        numStyle: num,
        hasCount: !other && !isSunday && count > 0,
        closed: !other && isSunday,
        countLabel: count + (count === 1 ? ' agendamento' : ' agendamentos'),
        barStyle: 'display: block; height: 100%; width: ' + occ[i] + '%; border-radius: 999px; background: ' + (past ? '#B9A6F4' : '#3E07D2') + ';'
      });
    }
    var proColor = { Bia: '#B4237A', 'Léo': '#0E7C86' };
    var st = {
      Atendido: { card: 'background: #F7F6FC; border: 1px solid #EEEBF6;', badge: 'color: #5E6475; background: #EEEBF6;', name: '' },
      Faltou: { card: 'background: #FFFFFF; border: 1px solid #E6E3F0; box-shadow: inset 3px 0 0 #C2410C;', badge: 'color: #9A3412; background: #FFF4ED;', name: '' },
      Confirmado: { card: 'background: #FFFFFF; border: 1px solid #E6E3F0; box-shadow: inset 3px 0 0 #0F9D58;', badge: 'color: #0B7A44; background: #E8F7EF;', name: '' },
      Agendado: { card: 'background: #FFFFFF; border: 1.5px solid #3E07D2;', badge: 'color: #3E07D2; background: #EEE8FD;', name: '' }
    };
    var raw = [
      { time: '09:00', name: 'Ana Souza', service: 'Piercing hélix', pro: 'Bia', status: 'Atendido' },
      { time: '10:00', name: 'Carla Lima', service: 'Anodização', pro: 'Léo', status: 'Faltou' },
      { time: '11:30', name: 'Juliana Reis', service: 'Troca de joia', pro: 'Bia', status: 'Atendido' },
      { now: true },
      { time: '14:00', name: 'Marina Costa', service: 'Piercing tragus', pro: 'Léo', status: 'Confirmado' },
      { time: '15:30', name: 'Paula Mendes', service: 'Piercing septo', pro: 'Bia', status: 'Agendado' },
      { time: '17:00', name: 'Renata Alves', service: 'Anodização', pro: 'Léo', status: 'Confirmado' }
    ];
    var items = raw.map(function (r) {
      if (r.now) return { isNow: true, isItem: false };
      var s = st[r.status];
      return {
        isNow: false, isItem: true, time: r.time, name: r.name, service: r.service, pro: r.pro, status: r.status,
        cardStyle: 'display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 12px; text-decoration: none; color: #29303C; ' + s.card,
        nameStyle: 'font-weight: 600; font-size: 15px;' + (r.status === 'Atendido' ? ' color: #5E6475;' : ''),
        dotStyle: 'display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: ' + proColor[r.pro] + ';',
        badgeStyle: 'flex: none; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 999px; ' + s.badge
      };
    });
    return { weekdays: weekdays, days: days, items: items };
  }
}
</script>
