<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Agendar no Studio Defendi — serviço</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #29303C; font-family: 'Figtree', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 18px; border-bottom: 1px solid #E6E3F0;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div aria-hidden="true" style="width: 56px; height: 56px; border-radius: 16px; background: {{brand}}; color: #FFFFFF; display: grid; place-items: center; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 20px;">SD</div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 21px;">Studio Defendi</h1>
        <span style="font-size: 13px; color: #5E6475;">Piercing e joias · Aberto hoje até 19h</span>
      </div>
    </div>
    <ol aria-label="Etapas do agendamento" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0;">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <li aria-current="{{s.current}}" style="display: flex; flex-direction: column; gap: 8px;">
          <span style="display: flex; align-items: center;">
            <span style="{{s.dotStyle}}"></span>
            <span style="{{s.lineStyle}}"></span>
          </span>
          <span style="{{s.labelStyle}}">{{s.label}}</span>
        </li>
      </sc-for>
    </ol>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px;">
    <h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 19px;">Escolha o serviço</h2>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;">
      <sc-for list="{{services}}" as="sv" hint-placeholder-count="6">
        <li style="border-bottom: 1px solid #EEEBF6;">
          <label style="display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 12px 0; cursor: pointer;">
            <input type="checkbox" checked="{{sv.selected}}" aria-label="{{sv.name}}" style="{{sv.boxStyle}}">
            <span style="display: flex; flex-direction: column; gap: 3px; flex: 1;">
              <span style="font-weight: 600; font-size: 16px;">{{sv.name}}</span>
              <span style="font-size: 13px; color: #5E6475;" class="num">{{sv.duration}}</span>
            </span>
            <span style="font-weight: 600; font-size: 16px;" class="num">{{sv.price}}</span>
          </label>
        </li>
      </sc-for>
    </ul>
  </div>

  <div style="padding: 14px 20px 20px; border-top: 1px solid #E6E3F0; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; font-size: 14px;">
      <span style="color: #5E6475;" class="num">1 serviço · 30 min</span>
      <span style="font-weight: 700;" class="num">R$ 90,00</span>
    </div>
    <a href="PublicaHorario.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 12px; background: {{brand}}; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px;">Continuar</a>
    <span style="align-self: center; font-size: 12px; color: #8A8FA0;">Agendamento por Eneven Agenda</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#B4237A","options":["#B4237A","#3E07D2","#0E7C86","#8A5A00"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var brand = this.props.brand ?? '#B4237A';
    var labels = ['Serviço', 'Profissional', 'Horário', 'Seus dados'];
    var current = 0;
    var steps = labels.map(function (l, i) {
      var done = i < current, cur = i === current;
      return {
        label: l, current: cur ? 'step' : 'false',
        dotStyle: 'width: 12px; height: 12px; border-radius: 50%; flex: none; ' + (cur || done ? 'background: #3E07D2;' : 'background: #FFFFFF; box-shadow: inset 0 0 0 2px #D9D5E6;'),
        lineStyle: 'flex: 1; height: 3px; ' + (i === labels.length - 1 ? 'background: transparent;' : (done ? 'background: linear-gradient(90deg, #3E07D2, #9429F7);' : (cur ? 'background: linear-gradient(90deg, #9429F7, #F581FB 40%, #EEEBF6 40%);' : 'background: #EEEBF6;'))),
        labelStyle: 'font-size: 12px; ' + (cur ? 'font-weight: 600; color: #29303C;' : 'color: #8A8FA0;')
      };
    });
    var raw = [
      { name: 'Piercing hélix', duration: '30 min', price: 'R$ 90', selected: true },
      { name: 'Piercing tragus', duration: '30 min', price: 'R$ 100' },
      { name: 'Piercing septo', duration: '40 min', price: 'R$ 120' },
      { name: 'Piercing nostril', duration: '30 min', price: 'R$ 90' },
      { name: 'Troca de joia', duration: '15 min', price: 'R$ 30' },
      { name: 'Anodização', duration: '20 min', price: 'R$ 40' }
    ];
    var services = raw.map(function (s) {
      return {
        name: s.name, duration: s.duration, price: s.price, selected: !!s.selected,
        boxStyle: 'width: 22px; height: 22px; margin: 0; flex: none; accent-color: ' + brand + ';'
      };
    });
    return { brand: brand, steps: steps, services: services };
  }
}
</script>
</body>
</html>
