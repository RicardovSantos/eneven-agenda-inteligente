<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Clientes no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3E07D2}a:hover{color:#2C0597}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F6FC; color: #29303C; font-family: 'Figtree', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E3F0; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 22px;">Clientes</h1>
      <span class="num" style="font-size: 14px; color: #5E6475;">248</span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 0 14px; background: #F7F6FC; border: 1px solid #E6E3F0; border-radius: 10px; color: #5E6475;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Buscar cliente</span>
      <input type="search" placeholder="Nome ou WhatsApp" style="flex: 1; min-width: 0; border: 0; outline: none; font: 400 16px 'Figtree', sans-serif; color: #29303C; background: transparent;">
    </label>
    <div role="group" aria-label="Filtrar clientes" style="display: flex; gap: 8px; overflow: hidden;">
      <button type="button" aria-pressed="true" style="flex: none; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #3E07D2; background: #EEE8FD; color: #3E07D2; font: 600 13px 'Figtree', sans-serif;">Todos</button>
      <button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E6E3F0; background: #FFFFFF; color: #29303C; font: 500 13px 'Figtree', sans-serif;">Com horário</button>
      <button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E6E3F0; background: #FFFFFF; color: #29303C; font: 500 13px 'Figtree', sans-serif;">Sem voltar há 60 dias</button>
    </div>
  </header>

  <ul style="flex: 1; overflow: hidden; margin: 0; padding: 0; list-style: none; background: #FFFFFF;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
      <li style="border-bottom: 1px solid #EEEBF6;">
        <a href="ClienteCelular.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 16px; color: #29303C; text-decoration: none;">
          <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: #EEE8FD; color: #3E07D2; display: grid; place-items: center; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; flex: none;">{{r.initials}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 16px; font-weight: 600;">{{r.name}}</span>
            <span class="num" style="{{r.subStyle}}">{{r.sub}}</span>
          </span>
          <span class="num" style="font-size: 14px; color: #5E6475;">{{r.visits}}</span>
        </a>
      </li>
    </sc-for>
  </ul>

  <a href="#" aria-label="Novo cliente" style="position: absolute; right: 18px; bottom: 92px; width: 56px; height: 56px; border-radius: 18px; background: #3E07D2; color: #FFFFFF; display: grid; place-items: center; box-shadow: 0 12px 32px -12px rgb(62 7 210 / 0.6);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
  </a>

  <nav aria-label="Menu" style="height: 72px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E6E3F0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 4px 10px;">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E6475; text-decoration: none; font-size: 12px; font-weight: 500;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Agenda
    </a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #3E07D2; text-decoration: none; font-size: 12px; font-weight: 600;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Clientes
    </a>
    <a href="PainelCelular.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E6475; text-decoration: none; font-size: 12px; font-weight: 500;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 20V10M12 20V4M6 20v-6"></path></svg>Painel
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5E6475; text-decoration: none; font-size: 12px; font-weight: 500;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>Mais
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var raw = [
      { name: 'Ana Souza', sub: 'Última visita hoje', visits: 4 },
      { name: 'Beatriz Lima', sub: 'Próximo: 07/11 às 10:00', visits: 7, next: true },
      { name: 'Carla Nogueira', sub: 'Última visita 20/10', visits: 2 },
      { name: 'Daniela Prado', sub: 'Última visita 17/10', visits: 9 },
      { name: 'Fernanda Reis', sub: 'Sem voltar há 86 dias', visits: 3 },
      { name: 'Gabriela Torres', sub: 'Próximo: 30/10 às 16:00', visits: 5, next: true },
      { name: 'Juliana Alves', sub: 'Sem voltar há 108 dias', visits: 1 },
      { name: 'Larissa Costa', sub: 'Última visita 09/10', visits: 6 },
      { name: 'Paula Martins', sub: 'Próximo: 28/10 às 14:30', visits: 12, next: true }
    ];
    var rows = raw.map(function (r) {
      var parts = r.name.split(' ');
      return {
        name: r.name, sub: r.sub,
        visits: r.visits + (r.visits === 1 ? ' visita' : ' visitas'),
        initials: parts[0][0] + parts[parts.length - 1][0],
        subStyle: 'font-size: 13px; ' + (r.next ? 'color: #3E07D2; font-weight: 600;' : 'color: #5E6475;')
      };
    });
    return { rows: rows };
  }
}
</script>
</body>
</html>
