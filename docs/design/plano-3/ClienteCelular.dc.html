<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ficha do cliente no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3E07D2}a:hover{color:#2C0597}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F6FC; color: #29303C; font-family: 'Figtree', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E6E3F0; padding: 8px 8px 8px 4px; display: flex; align-items: center; justify-content: space-between;">
    <a href="ClientesCelular.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px; color: #29303C; text-decoration: none; font-size: 16px; font-weight: 500;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      Clientes
    </a>
    <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 15px; font-weight: 600; text-decoration: none;">Editar</a>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 50%; background: #EEE8FD; color: #3E07D2; display: grid; place-items: center; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 20px; flex: none;">PM</span>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 22px;">Paula Martins</h1>
        <span class="num" style="font-size: 14px; color: #5E6475;">(11) 98123-4567</span>
      </div>
    </div>

    <div style="display: flex; gap: 8px;">
      <a href="#" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; border-radius: 10px; background: #3E07D2; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Agendar
      </a>
      <a href="#" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; border-radius: 10px; border: 1px solid #E6E3F0; background: #FFFFFF; color: #29303C; text-decoration: none; font-weight: 600; font-size: 15px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"></path></svg>
        WhatsApp
      </a>
    </div>

    <dl style="margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border: 1px solid #E6E3F0; border-radius: 14px;">
      <div style="padding: 12px; display: flex; flex-direction: column-reverse; gap: 2px; border-right: 1px solid #EEEBF6;"><dt style="font-size: 12px; color: #5E6475;">Visitas</dt><dd class="num" style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 20px;">12</dd></div>
      <div style="padding: 12px; display: flex; flex-direction: column-reverse; gap: 2px; border-right: 1px solid #EEEBF6;"><dt style="font-size: 12px; color: #5E6475;">Total gasto</dt><dd class="num" style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 20px;">R$ 1.080</dd></div>
      <div style="padding: 12px; display: flex; flex-direction: column-reverse; gap: 2px;"><dt style="font-size: 12px; color: #5E6475;">Faltas</dt><dd class="num" style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 20px;">1</dd></div>
    </dl>

    <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #EEE8FD; border-radius: 14px; color: #29303C; text-decoration: none;">
      <span style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 48px; flex: none;">
        <span style="font-size: 12px; font-weight: 600; color: #3E07D2;">qua.</span>
        <span class="num" style="font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 22px; line-height: 1.1; color: #3E07D2;">28</span>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 13px; color: #5E6475;">Próximo horário</span>
        <span class="num" style="font-size: 15px; font-weight: 600;">14:30 · Piercing tragus com Bia</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6475" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: #FFFFFF; border: 1px solid #E6E3F0; border-radius: 14px;">
      <span style="font-size: 13px; font-weight: 600; color: #5E6475;">Observações</span>
      <span style="font-size: 15px;">Alergia a níquel: usar só titânio.</span>
    </div>

    <section aria-labelledby="h-hist" style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E6E3F0; border-radius: 14px; padding: 4px 14px;">
      <h2 id="h-hist" style="margin: 0; padding: 10px 0 6px; font-size: 15px; font-weight: 600;">Histórico</h2>
      <ul style="margin: 0; padding: 0; list-style: none;">
        <sc-for list="{{history}}" as="h" hint-placeholder-count="4">
          <li style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #EEEBF6;">
            <span class="num" style="width: 44px; flex: none; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 15px;">{{h.date}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
              <span style="font-size: 15px; font-weight: 600;">{{h.service}}</span>
              <span style="font-size: 13px; color: #5E6475;">com {{h.pro}}</span>
            </span>
            <span style="{{h.badge}}">{{h.status}}</span>
          </li>
        </sc-for>
      </ul>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function badge(kind) {
      var base = 'font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; ';
      if (kind === 'noshow') return base + 'color: #C2410C; background: #FFF1E8;';
      return base + 'color: #5E6475; background: #F1EEF8;';
    }
    var raw = [
      { date: '06/10', service: 'Troca de joia', pro: 'Léo', status: 'Atendido', kind: 'done' },
      { date: '18/09', service: 'Piercing hélix', pro: 'Bia', status: 'Atendido', kind: 'done' },
      { date: '29/08', service: 'Anodização', pro: 'Léo', status: 'Faltou', kind: 'noshow' },
      { date: '12/08', service: 'Piercing septo', pro: 'Bia', status: 'Atendido', kind: 'done' }
    ];
    var history = raw.map(function (h) {
      return { date: h.date, service: h.service, pro: h.pro, status: h.status, badge: badge(h.kind) };
    });
    return { history: history };
  }
}
</script>
</body>
</html>
