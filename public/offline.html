<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3E07D2">
<title>Sem conexão · Eneven Agenda</title>
<style>
  :root {
    --ink: #29303c;
    --ink-muted: #5e6475;
    --canvas: #f7f6fc;
    --surface: #ffffff;
    --line: #e6e3f0;
    --primary: #3e07d2;
    --primary-text: #ffffff;
    --accent: #9429f7;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eceaf5;
      --ink-muted: #a9a6bd;
      --canvas: #15131f;
      --surface: #1e1b2c;
      --line: #2e2a40;
      --primary: #a673ff;
      --primary-text: #15131f;
      --accent: #c08bff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--canvas);
    color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    width: 100%;
    max-width: 400px;
    padding: 32px 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .logo { display: block; width: 148px; height: auto; margin: 0 0 32px; }
  .logo-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .logo-light { display: none; }
    .logo-dark { display: block; }
  }
  h1 {
    margin: 0 0 8px;
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1.75rem;
    font-weight: 600;
    line-height: 1.2;
  }
  p { margin: 0 0 24px; color: var(--ink-muted); font-size: 1rem; }
  button {
    min-height: 44px;
    padding: 0 24px;
    border: 0;
    border-radius: 10px;
    background: var(--primary);
    color: var(--primary-text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img class="logo logo-light" src="/brand/logo.png" alt="Eneven Agenda" width="148" height="52">
  <img class="logo logo-dark" src="/brand/logo-dark.png" alt="" width="148" height="52">
  <h1>Sem conexão</h1>
  <p>O agendamento precisa de internet. Verifique sua conexão e tente de novo.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
